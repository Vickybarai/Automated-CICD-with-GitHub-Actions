name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:

  ci:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Fix Binary Permissions
        working-directory: ./backend
        run: chmod -R +x node_modules/.bin/eslint

      - name: Test ESLint
        working-directory: ./backend
        run: |
          echo "Testing ESLint version..."
          ./node_modules/.bin/eslint --version

      - name: Run Lint
        working-directory: ./backend
        run: npm run lint

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
      # =========================
      # DOCKER LOGIN
      # =========================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # FRONTEND
      # =========================
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-frontend:latest

      # =========================
      # BACKEND
      # =========================
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-backend:latest


  cd:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest

    environment: production1
    needs: ci

    steps:

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            # Pull latest Docker images
            docker pull ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-frontend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-backend:latest

            # Stop existing containers
            docker stop frontend || true
            docker rm frontend || true

            docker stop backend || true
            docker rm backend || true

            # Run Backend
            docker run -d \
              --name backend \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-backend:latest

            # Run Frontend
            docker run -d \
              --name frontend \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/github-action-cicd-frontend:latest