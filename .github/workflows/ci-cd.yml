name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:

  ci:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # STAGE 1: CHECKOUT
      # ========================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================
      # STAGE 2: CHECK NODE & NPM
      # ========================================
      - name: Check Node Environment
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version


      # ========================================
      # STAGE 3: INSTALL DEPENDENCIES
      # ========================================
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm install


      # ========================================
      # STAGE 4: VERIFY ESLINT INSTALLATION
      # ========================================
      - name: Verify ESLint
        working-directory: ./backend
        run: |
          echo "Checking ESLint package..."
          npm ls eslint

          echo ""
          echo "Checking ESLint binary..."
          ls -la node_modules/.bin/eslint

          echo ""
          echo "Checking ESLint executable..."
          ls -la node_modules/eslint/bin/eslint.js


      # ========================================
      # STAGE 5: TEST ESLINT DIRECTLY
      # ========================================
      - name: Test ESLint
        working-directory: ./backend
        run: |
          echo "Testing ESLint version..."
          ./node_modules/.bin/eslint --version


      # ========================================
      # STAGE 6: RUN LINT
      # ========================================
      - name: Run Backend Lint
        working-directory: ./backend
        run: |
          npm run lint


      # ========================================
      # STAGE 7: GITLEAKS
      # ========================================
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

